kind = "web"
previewPath = "/sat-visualizer/"
title = "SAT Passage Visualizer"
version = "1.0.0"
id = "artifacts/sat-visualizer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/sat-visualizer/" ]
localPort = 26138

[services.development]
run = "pnpm --filter @workspace/sat-visualizer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sat-visualizer", "run", "build" ]
publicDir = "artifacts/sat-visualizer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26138"
BASE_PATH = "/sat-visualizer/"
